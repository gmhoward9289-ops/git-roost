name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here writes. Declared explicitly rather than inherited: repos created
# before the default flipped hand out contents: write, which no job here needs.
permissions:
  contents: read

jobs:
  test:
    # git-roost claims 3.9+ on macOS, Linux and Windows, and all three claims are
    # load-bearing. Windows especially: the ANSI/VT path and git's path handling
    # are the two things that differ, and neither is exercised by a Linux run.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Run tests
        run: python -m unittest discover -s tests -v

      # The contract says --version and --help must work with zero git repos
      # present. A GitHub runner's workspace is a repo, so cd somewhere that
      # isn't one -- otherwise this passes for the wrong reason.
      - name: CLI works outside a repo
        shell: bash
        run: |
          set -euo pipefail
          root="$(python -c 'import tempfile; print(tempfile.mkdtemp())')"
          cd "$root"
          python "$GITHUB_WORKSPACE/git_roost.py" --version
          python "$GITHUB_WORKSPACE/git_roost.py" --help > /dev/null
          python "$GITHUB_WORKSPACE/git_roost.py" --root "$root" --no-color

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # roost shipped a v0.3 whose man page and Homebrew formula still said 0.2,
      # because nothing read the artifacts that embed the version as text.
      - name: Version consistency across artifacts
        run: packaging/check-version-consistency.sh

      - name: Build the wheel and sdist
        run: |
          set -euo pipefail
          python -m pip install --quiet build
          python -m build

      # Installing the wheel is the only way to prove the entry point name, the
      # module name and the shared-data man page path all line up. A build that
      # succeeds can still install to a broken console script.
      - name: The installed wheel actually runs
        run: |
          set -euo pipefail
          python -m venv /tmp/v
          /tmp/v/bin/pip install --quiet dist/*.whl
          /tmp/v/bin/git-roost --version
          test -f /tmp/v/share/man/man1/git-roost.1

      - name: The .deb builds and carries the same version
        run: |
          set -euo pipefail
          packaging/build-deb.sh
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' git_roost.py)
          test -f "dist/git-roost_${version}_all.deb"
          # "the file on disk is right" and "the right file was packaged" are
          # different claims; read the man page back out of the package.
          rm -rf /tmp/debx && mkdir -p /tmp/debx
          dpkg-deb -x "dist/git-roost_${version}_all.deb" /tmp/debx
          got=$(gunzip -c /tmp/debx/usr/share/man/man1/git-roost.1.gz | head -1)
          case "$got" in
            *"\"git-roost ${version}\""*) ;;
            *) echo "::error::man page in the .deb says: $got"; exit 1 ;;
          esac
          /tmp/debx/usr/bin/git-roost --version

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        run: shellcheck -S warning packaging/*.sh

      # git-roost's core safety claim is that it cannot mutate a repo. That is
      # enforced by an allowlist in git(), so the allowlist is the thing worth
      # testing -- see tests/. This job additionally refuses any *new* direct
      # subprocess call to git that bypasses the wrapper.
      - name: Every git call goes through the read-only wrapper
        run: |
          set -euo pipefail
          # One subprocess.run in the file, and it must be the one inside git().
          n=$(grep -c 'subprocess\.run' git_roost.py)
          if [ "$n" -ne 1 ]; then
            echo "::error::expected exactly 1 subprocess.run (inside git()), found $n"
            grep -n 'subprocess\.run' git_roost.py
            exit 1
          fi
          # And nothing may shell out to git any other way.
          if grep -nE 'os\.(system|popen)|subprocess\.(call|check_output|Popen|check_call)' git_roost.py; then
            echo "::error::git must only be invoked through git(), which enforces READ_ONLY"
            exit 1
          fi
          echo "one guarded git invocation path, as designed"

  semgrep:
    runs-on: ubuntu-latest
    # Every code path in git-roost shells out to git, so p/python's subprocess
    # and shell-injection rules cover exactly this program's shape. The lint job
    # above proves *that* the read-only wrapper is the only way out to git; it
    # says nothing about how arguments reach it, and an argument built by string
    # concatenation would satisfy that grep while still being the bug. p/secrets
    # is close to free on a repo with no credentials, but it is the cheap half
    # of the pair and both siblings (roost, leghorn) run both.
    #
    # Run as a container rather than an action so the ruleset and the binary
    # arrive together. Pinned by digest, not by the :latest tag the siblings
    # use: this repo pins every action to a commit SHA, and a floating tag on
    # the one job whose whole purpose is supply-chain checking would be the
    # loudest possible place to make an exception. Digest resolved from
    # semgrep/semgrep:latest on 2026-08-19; bump it deliberately, and expect new
    # findings when you do -- that is the point of a ruleset that moves.
    container:
      image: semgrep/semgrep@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --error makes findings fail the build rather than annotate it: a
      # security job that only warns is a security job nobody reads.
      # --metrics=off because scan telemetry to a third party is not something
      # a CI run should opt this repo into by default.
      #
      # As of 2026-08-19 this is clean -- 0 findings from 195 rules over every
      # file in the tree -- so there is no baseline to suppress. If that changes,
      # annotate the specific line with `# nosemgrep: <rule-id>` and the reason
      # it is a false positive; never add a blanket ignore file, which hides the
      # next real finding along with this one.
      - name: Semgrep
        run: semgrep scan --config p/python --config p/secrets --error --metrics=off .
