name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here writes. Declared explicitly rather than inherited: repos created
# before the default flipped hand out contents: write, which no job here needs.
permissions:
  contents: read

jobs:
  test:
    # git-roost claims 3.9+ on macOS, Linux and Windows, and all three claims are
    # load-bearing. Windows especially: the ANSI/VT path and git's path handling
    # are the two things that differ, and neither is exercised by a Linux run.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Run tests
        run: python -m unittest discover -s tests -v

      # The contract says --version and --help must work with zero git repos
      # present. A GitHub runner's workspace is a repo, so cd somewhere that
      # isn't one -- otherwise this passes for the wrong reason.
      - name: CLI works outside a repo
        shell: bash
        run: |
          set -euo pipefail
          root="$(python -c 'import tempfile; print(tempfile.mkdtemp())')"
          cd "$root"
          python "$GITHUB_WORKSPACE/git_roost.py" --version
          python "$GITHUB_WORKSPACE/git_roost.py" --help > /dev/null
          python "$GITHUB_WORKSPACE/git_roost.py" --root "$root" --no-color

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # roost shipped a v0.3 whose man page and Homebrew formula still said 0.2,
      # because nothing read the artifacts that embed the version as text.
      - name: Version consistency across artifacts
        run: packaging/check-version-consistency.sh

      - name: Build the wheel and sdist
        run: |
          set -euo pipefail
          python -m pip install --quiet build
          python -m build

      # Installing the wheel is the only way to prove the entry point name, the
      # module name and the shared-data man page path all line up. A build that
      # succeeds can still install to a broken console script.
      - name: The installed wheel actually runs
        run: |
          set -euo pipefail
          python -m venv /tmp/v
          /tmp/v/bin/pip install --quiet dist/*.whl
          /tmp/v/bin/git-roost --version
          test -f /tmp/v/share/man/man1/git-roost.1

      - name: The .deb builds and carries the same version
        run: |
          set -euo pipefail
          packaging/build-deb.sh
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' git_roost.py)
          test -f "dist/git-roost_${version}_all.deb"
          # "the file on disk is right" and "the right file was packaged" are
          # different claims; read the man page back out of the package.
          rm -rf /tmp/debx && mkdir -p /tmp/debx
          dpkg-deb -x "dist/git-roost_${version}_all.deb" /tmp/debx
          got=$(gunzip -c /tmp/debx/usr/share/man/man1/git-roost.1.gz | head -1)
          case "$got" in
            *"\"git-roost ${version}\""*) ;;
            *) echo "::error::man page in the .deb says: $got"; exit 1 ;;
          esac
          /tmp/debx/usr/bin/git-roost --version

  # Separate job on windows-latest, not a step of `packaging` above: the
  # winget zip's whole point is a real PE executable
  # (packaging/git-roost-launcher.cs, compiled to git-roost.exe), and
  # producing one needs Add-Type reaching into .NET Framework, which only
  # exists on Windows -- the ubuntu-latest `packaging` job has no C# compiler
  # at all. Unlike the .deb/.whl/npm tarball, nothing installs a dependency
  # for this zip either, so a build that silently produces a broken exe is a
  # broken install with no error until a user hits it.
  packaging-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # MUST be Windows PowerShell (powershell.exe), not PowerShell 7/Core
      # (pwsh) -- see build-windows-zip.ps1's header comment. windows-latest
      # runners default `shell: pwsh` on a bare `run:`, so this has to say so
      # explicitly rather than relying on the runner's default.
      - name: Build the Windows portable zip
        shell: powershell
        run: packaging/build-windows-zip.ps1

      # Building a valid zip and building a zip winget can actually install
      # are different claims -- this proves the second one by doing exactly
      # what a portable winget install does: extract, then run the exe
      # in-place, expecting it to find git_roost.py next to itself and Python
      # on PATH (setup-python below puts one there).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: The zip contains a real exe that actually runs
        shell: powershell
        run: |
          $version = (Select-String -Path git_roost.py -Pattern '^__version__ = "(.*)"').Matches[0].Groups[1].Value
          $zipPath = "dist/git-roost-$version-windows.zip"
          if (-not (Test-Path $zipPath)) { throw "$zipPath was not built" }

          $extractDir = Join-Path ([System.IO.Path]::GetTempPath()) ([System.Guid]::NewGuid())
          Expand-Archive -Path $zipPath -DestinationPath $extractDir
          $entries = Get-ChildItem $extractDir | Select-Object -ExpandProperty Name
          $want = @("git-roost.exe", "git_roost.py")
          # Compare-Object, not a sorted-string comparison: PowerShell's
          # default string sort is culture-aware and orders "_" before "-"
          # differently than a naive expectation, which briefly made this
          # check fail on a correct zip.
          if (@(Compare-Object $entries $want).Count -ne 0) {
            throw "$zipPath contains: $($entries -join ',') (want: $($want -join ','))"
          }

          $got = & "$extractDir/git-roost.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "git-roost.exe --version exited $LASTEXITCODE" }
          if ($got -ne "git-roost $version") { throw "git-roost.exe --version printed '$got', want 'git-roost $version'" }

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        run: shellcheck -S warning packaging/*.sh

      # git-roost's core safety claim is that it cannot mutate a repo (or a PR,
      # once --github is in play). That is enforced by an allowlist in git()
      # and, separately, one in gh_call() -- so the allowlists are the thing
      # worth testing, see tests/. This job additionally refuses any *new*
      # direct subprocess call to git or gh that bypasses either wrapper.
      - name: Every git/gh call goes through a read-only wrapper
        run: |
          set -euo pipefail
          # Exactly three subprocess.run in the file: one inside git(), one
          # inside gh_call(), and one in to_clipboard() for explicit operator
          # clipboard copies. Not "at least three" -- a fourth guarded path is
          # still a new invocation surface this check exists to make a reviewer
          # look at, not something to wave through silently.
          n=$(grep -c 'subprocess\.run' git_roost.py)
          if [ "$n" -ne 3 ]; then
            echo "::error::expected exactly 3 subprocess.run calls (git(), gh_call(), to_clipboard()), found $n"
            grep -n 'subprocess\.run' git_roost.py
            exit 1
          fi
          # Each call site must sit behind its own read-only guard: git()'s
          # subprocess.run behind check_read_only(args), gh_call()'s behind
          # check_gh_read_only(args). Grepping the whole file for the guard
          # names would pass even if a guard were deleted from one function
          # and left dangling elsewhere, so this greps each function's own
          # body instead -- a plain /start/,/end/ range won't do, because the
          # start line itself also matches a bare "^def " end pattern and the
          # range would close on the same line it opened.
          extract() {
            awk -v fn="$1" '
              $0 ~ "^def " fn "\\(" { infunc=1 }
              infunc && /^def / && $0 !~ "^def " fn "\\(" { infunc=0 }
              infunc { print }
            ' git_roost.py
          }
          if ! extract git | grep -q 'check_read_only(args)'; then
            echo "::error::git()'s subprocess.run is no longer guarded by check_read_only()"
            exit 1
          fi
          if ! extract gh_call | grep -q 'check_gh_read_only(args)'; then
            echo "::error::gh_call()'s subprocess.run is no longer guarded by check_gh_read_only()"
            exit 1
          fi
          # And nothing may shell out to git or gh any other way.
          if grep -nE 'os\.(system|popen)|subprocess\.(call|check_output|Popen|check_call)' git_roost.py; then
            echo "::error::git/gh must only be invoked through git()/gh_call(), which enforce READ_ONLY"
            exit 1
          fi
          echo "two guarded invocation paths (git, gh), as designed"

  semgrep:
    runs-on: ubuntu-latest
    # Every code path in git-roost shells out to git, so p/python's subprocess
    # and shell-injection rules cover exactly this program's shape. The lint job
    # above proves *that* the read-only wrapper is the only way out to git; it
    # says nothing about how arguments reach it, and an argument built by string
    # concatenation would satisfy that grep while still being the bug. p/secrets
    # is close to free on a repo with no credentials, but it is the cheap half
    # of the pair and both siblings (roost, leghorn) run both.
    #
    # Run as a container rather than an action so the ruleset and the binary
    # arrive together. Pinned by digest, not by the :latest tag the siblings
    # use: this repo pins every action to a commit SHA, and a floating tag on
    # the one job whose whole purpose is supply-chain checking would be the
    # loudest possible place to make an exception. Digest resolved from
    # semgrep/semgrep:latest on 2026-08-19; bump it deliberately, and expect new
    # findings when you do -- that is the point of a ruleset that moves.
    container:
      image: semgrep/semgrep@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --error makes findings fail the build rather than annotate it: a
      # security job that only warns is a security job nobody reads.
      # --metrics=off because scan telemetry to a third party is not something
      # a CI run should opt this repo into by default.
      #
      # As of 2026-08-19 this is clean -- 0 findings from 195 rules over every
      # file in the tree -- so there is no baseline to suppress. If that changes,
      # annotate the specific line with `# nosemgrep: <rule-id>` and the reason
      # it is a false positive; never add a blanket ignore file, which hides the
      # next real finding along with this one.
      - name: Semgrep
        run: semgrep scan --config p/python --config p/secrets --error --metrics=off .
