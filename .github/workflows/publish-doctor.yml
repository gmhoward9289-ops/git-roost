name: publish-doctor

# Does every channel actually serve the version git-roost claims to be?
#
# This exists because job status is not the same fact. In roost, between v0.7.0
# and v0.8.0, npm silently served 0.6.1: the publish job failed with a 404 on
# PUT (npm's way of saying unauthorized -- no trusted publisher was configured
# for roost-top), and since release.yml lets each publish job fail alone so the
# others still land, that red job scrolled away and nobody looked. Meanwhile
# `npm i -g roost-top` kept handing people software two releases old.
#
# So this checks the registries themselves rather than the workflow that should
# have written to them, and it runs on a schedule rather than only at release
# time -- a channel can rot after a successful publish (a tap PAT lapses, a
# formula is overwritten), and the daily run is what catches that.
#
# It matters more here than in the siblings: git-roost has never published to
# PyPI or npm, and its only release (v0.1) was cut by hand. The first thing
# release automation does will be the first thing nobody has ever verified. The
# script reports never-established channels as TODO rather than PENDING or FAIL
# precisely so this workflow stays green -- and therefore worth reading -- until
# an established channel genuinely disagrees.
#
# Read-only. It installs nothing and publishes nothing, and `permissions` below
# grants nothing that could.

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["release"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: publish-doctor
  cancel-in-progress: false

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a full commit SHA, not a floating tag. The siblings float
      # @v7; a tag is mutable and a compromised action reads whatever the job
      # can read, so every action in this repo is pinned by digest.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A publish is not instant: npm and PyPI take a moment to serve a new
      # version, and the tap push lands after the release job reports success.
      # The script's own PENDING window (60 minutes from the release's
      # publishedAt) already covers that, so this sleep is belt-and-braces for
      # the post-release run -- it costs two minutes and buys a report that
      # reads PASS instead of PENDING for channels that are merely seconds away.
      - name: Let the registries catch up
        if: github.event_name == 'workflow_run'
        run: sleep 120

      - name: Run the publish doctor
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash packaging/publish-doctor.sh
